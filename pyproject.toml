[project]
name = "tdr-detective"
version = "0.1.0"
description = "Read-only Windows stability triage: an MCP server, an Agent Skill, and a measured eval harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastmcp==4.1.0",
    "pydantic>=2.14,<3",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
# Agent runner + eval harness (Claude Agent SDK and the Anthropic API).
agent = [
    "claude-agent-sdk==0.2.165",
    "anthropic==1.13.0",
]

[project.scripts]
pc-diag-mcp = "pc_diag_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pc_diag_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "windows: requires a live Windows host (powershell.exe)",
    "live: calls a paid model API",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603"]  # subprocess calls are deliberate and use fixed argument lists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
